<!DOCTYPE html>
<html lang="pt-br">
<html>
    <head>
        <meta charset="UTF-8">
        <title>
            Página Sete
        </title>

        <link rel="icon" type="image/png" href="assets/logo.png">

        <link rel="stylesheet" href="style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <header class="menu">
            <a class="menu-link" href="#promocoes">Novidades</a>
            <a class="titulo">Página Sete</a>
            <div class="menu-botoes">
                <button class="botao" id="abrir-pedidos">
                    Pedidos
                    <span id="pedidos-novidade" hidden></span>
                </button>

                <button class="botao" id="abrir-carrinho" aria-label="Abrir carrinho">
                    <img src="assets/shopping-basket.svg" alt="Carrinho">
                    <span id="contador-carrinho" hidden>0</span>
                </button>
            </div>
        </header>

        <section id="catalogo">
            <img style="display: block; margin: 0 auto; margin-top: 4rem;" src="assets/logo.png">
            <div class="catalogo-texto">
                <h2 class="subtitulo">Catálogo</h2>
                <p>Confira nossa coleção de livros disponíveis para você!</p>
            </div>
            <div class="container-catalogo" id="catalogo"></div>
        </section>
        <section id="promocoes" class="container-interesse">
            <h2>Inscreva-se para receber nossas promoções!</h2>
            <label for="email">Seu e-mail</label>
            <input type="email" id="email" name="email" required placeholder="Ex. seuemail@gmail.com"> 

            <p class="categoria-titulo">Escolha seus gêneros favoritos</p>
            <div class="categorias">
                <input class="categoria" type="checkbox" id="romance" name="genero" value="romance">
                <label for="romance">Romance</label><br>

                <input class="categoria" type="checkbox" id="terror" name="genero" value="terror">
                <label for="terror">Terror</label><br>

                <input class="categoria" type="checkbox" id="quadrinhos" name="genero" value="quadrinhos">
                <label for="quadrinhos">Quadrinhos</label><br>
            </div>
            <button class="botao-interesse" id="botaoInteresse">Inscreva-se</button>
            <button class="botao-interesse" id="botaoCancelaInteresse">Cancelar inscrição</button>
            <p id="interesse-msg" role="status"></p>
            </section>
        <div class="overlay" id="overlay"></div>

        <aside class="carrinho-lateral" id="carrinho-lateral" aria-label="Carrinho" aria-hidden="true">
            <header class="carrinho-topo">
                <h2>Seu carrinho</h2>
                <button id="fechar-carrinho" aria-label="Fechar carrinho">✕</button>
            </header>

            <div class="carrinho-itens" id="carrinho-itens"></div>
            <div class="carrinho-status" id="carrinho-status" hidden></div>

            <footer class="carrinho-rodape">
                <p>Total: <strong id="carrinho-total">R$ 0,00</strong></p>
                <button class="btn-comprar" id="finalizar-pedido">Finalizar compra</button>
            </footer>
        </aside>
        <div class="overlay" id="overlay-pedidos"></div>
            <aside class="carrinho-lateral" id="painel-pedidos" aria-label="Meus pedidos" aria-hidden="true">
                <header class="carrinho-topo">
                    <h2>Meus pedidos</h2>
                    <button id="fechar-pedidos" aria-label="Fechar pedidos">✕</button>
                </header>
                <div class="carrinho-itens" id="lista-pedidos"></div>
            </aside>
        
        <script src="js/principal.js"></script>
        <script src="js/carrinho.js"></script>
        <script src="js/pedidos.js"></script>
        <script src="js/promocao.js"></script>
    </body>
</html>
