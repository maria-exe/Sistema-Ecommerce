<!DOCTYPE html>
<html lang="pt-br">
<html>
    <head>
        <meta charset="UTF-8">
        <title>
            Página Sete
        </title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <header class="menu">
            <a class="menu-link" href="#promocoes">Novidades</a>
            <a class="titulo">[Página Sete]</a>
            <div class="menu-botoes">
                <button class="botao">Pedidos</button>

                <button class="botao" id="abrir-carrinho" aria-label="Abrir carrinho">
                    <img src="assets/shopping-basket.svg" alt="Carrinho">
                </button>
            </div>
        </header>

        <section id="catalogo">
            <div class="catalogo-texto">
                <h2 class="subtitulo">Catálogo</h2>
                <p>Confira nossa coleção de livros disponíveis para você!</p>
            </div>
            <div class="container-catalogo" id="catalogo"></div>
        </section>
        <section id="promocoes" class="container-interesse">
            <h2>Inscreva-se para receber nossas promoções!</h2>
            <label for="email">Seu e-mail</label>
            <input type="email" id="email" name="email" required placeholder="Ex. seuemail@gmail.com"> 

            <p class="categoria-titulo">Escolha seus gêneros favoritos</p>
            <div class="categorias">
                <input class="categoria" type="checkbox" id="romance" name="genero" value="romance">
                <label for="romance">Romance</label><br>

                <input class="categoria" type="checkbox" id="terror" name="genero" value="terror">
                <label for="terror">Terror</label><br>

                <input class="categoria" type="checkbox" id="quadrinhos" name="genero" value="quadrinho">
                <label for="quadrinhos">Quadrinhos</label><br>
            </div>
            <button class="botao-interesse" id="botaoInteresse">Inscreva-se</button>
        </section>
</aside>
    </body>
    <script src="js/principal.js"></script>
    <script src="js/promocao.js"></script>
</html>
